<style>/* Layout: app shell — sticky top bar, one scrolling view, bottom tab bar. Felt-green range ramp; one red accent for actions. */
:root{
  --bg:#f1f3ef; --panel:#ffffff; --ink:#17201b; --muted:#5b695f; --line:#d6dcd4; --soft:#e7ebe5;
  --accent:#c2362c; --accent-ink:#ffffff;
  --off:#e5e9e3; --off-ink:#8e9a91;
  --r5:#0d4a32; --r4:#1d6e47; --r3:#3f9466; --r2:#7dbb8c; --r1:#c4e2c6;
  --r5-ink:#fff; --r4-ink:#fff; --r3-ink:#fff; --r2-ink:#0d2a1c; --r1-ink:#1d3a2a;
  --good:#1d7a4c; --ok:#5f9a2f; --warn:#c58a10; --bad:#c2362c;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --panel:#161e1a; --ink:#e6ece7; --muted:#95a49a; --line:#29342e; --soft:#1d2621;
  --accent:#ff6b5e; --accent-ink:#1a0806; --off:#1b241f; --off-ink:#6f7f74;
  --r5:#7fdca4; --r4:#4fb87c; --r3:#2f8a58; --r2:#215f3f; --r1:#1a3c2a;
  --r5-ink:#062014; --r4-ink:#062014; --r3-ink:#eafff1; --r2-ink:#d6f2df; --r1-ink:#b9d8c4;
  --good:#6fd39a; --ok:#b4d96a; --warn:#f0bd4f; --bad:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --panel:#161e1a; --ink:#e6ece7; --muted:#95a49a; --line:#29342e; --soft:#1d2621;
  --accent:#ff6b5e; --accent-ink:#1a0806; --off:#1b241f; --off-ink:#6f7f74;
  --r5:#7fdca4; --r4:#4fb87c; --r3:#2f8a58; --r2:#215f3f; --r1:#1a3c2a;
  --r5-ink:#062014; --r4-ink:#062014; --r3-ink:#eafff1; --r2-ink:#d6f2df; --r1-ink:#b9d8c4;
  --good:#6fd39a; --ok:#b4d96a; --warn:#f0bd4f; --bad:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.top h1 span{color:var(--accent)}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto;display:grid;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 12px var(--font);padding:6px 0;display:grid;justify-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h2{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:600 15px var(--font);border-radius:11px;padding:12px 16px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px;display:grid;gap:2px;min-width:0}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:600 13px var(--font);border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:600 14px var(--font);padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);max-width:100%}
.chartbox svg{width:100%;height:auto;display:block}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.g-m{background:var(--good);color:var(--panel)}.g-s{background:var(--ok);color:var(--panel)}.g-l{background:var(--warn);color:#1a1200}.g-n{background:var(--bad);color:#fff}.g-0{background:var(--soft);color:var(--muted)}
.mastery{width:100%;border-collapse:separate;border-spacing:3px;font-size:13px}
.mastery th{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:2px}
.mastery th.l{text-align:left}
.mastery td{border-radius:6px;text-align:center;padding:8px 2px;font-variant-numeric:tabular-nums;font-weight:700;font-size:12px}
.mastery td.l{text-align:left;background:none;font-weight:600;padding-left:0;cursor:pointer;color:var(--ink)}
.mastery td.l small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:8px !important;text-align:left !important}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;background:var(--soft);border-radius:9px;padding:9px 11px;font-size:14px;align-items:center}
.list li small{color:var(--muted);display:block;font-size:12px}
.mono{font-family:var(--mono);font-weight:700}
/* drill */
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.situ{display:grid;gap:4px}
.situ b{font-size:17px}
.cards{display:flex;gap:10px;justify-content:center;padding:6px 0}
.card{width:72px;height:100px;border-radius:10px;background:#fbfbf9;border:1px solid #cfd4cc;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:800 34px/1 var(--font);color:#1a1d1b;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card small{font-size:26px;margin-top:2px}
.card.red{color:#c2362c}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer .btn{padding:18px 10px;font-size:18px;font-weight:800}
.fb{border-radius:10px;padding:12px;font-size:14px;display:grid;gap:4px}
.fb.ok{background:color-mix(in srgb,var(--good) 16%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fb b{font-size:16px}
.fb.ok b{color:var(--good)}.fb.no b{color:var(--bad)}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
/* grid chart */
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}
.c{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;overflow:hidden;
  font:700 clamp(7px,2.2vw,12px)/1 var(--mono);letter-spacing:-.03em;background:var(--off);color:var(--off-ink)}
.c i{font-style:normal;font-weight:500;font-size:.8em;opacity:.85;margin-top:2px}
.c.b1{background:var(--r1);color:var(--r1-ink)}.c.b2{background:var(--r2);color:var(--r2-ink)}.c.b3{background:var(--r3);color:var(--r3-ink)}
.c.b4{background:var(--r4);color:var(--r4-ink)}.c.b5{background:var(--r5);color:var(--r5-ink)}
.c.pick{outline:3px solid var(--accent);outline-offset:-1px;position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend em{width:13px;height:13px;border-radius:3px;display:inline-block}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--accent)}
.slider b{font-size:28px;min-width:3.4ch;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.chips button{text-align:left;font:500 13px/1.3 var(--font);border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:9px 10px;border-radius:9px;cursor:pointer}
.chips button b{display:block;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
textarea{width:100%;min-height:90px;font:12px var(--mono);border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>

    .sort((a,b)=>b.count-a.count);
}

/* ---------- question generator ---------- */
const rand = n => Math.floor(Math.random()*n);
function pick(ch, used){
  const g=gridOf(ch), rs=rowsOf(ch);
  const misses=missPool(ch.id).filter(m=>!used.has(m.h+"|"+m.s));
  if(misses.length && Math.random()<0.25){ const m=misses[rand(Math.min(misses.length,10))]; return {h:m.h,s:m.s}; }
  for(let t=0;t<60;t++){
    const s=g[rand(g.length)], k=g.indexOf(s), h=rand(169);
    if(used.has(h+"|"+s)) continue;
    let border=false;
    for(let j=Math.max(0,k-2);j<=Math.min(g.length-1,k+2);j++) if(rs[j][h]!==rs[k][h]) border=true;
    // neighbour cells in the grid with a different answer also count as borderline
    if(!border){
      const n=D.names[h]; const r1=R.indexOf(n[0]), r2=R.indexOf(n[1]);
      const pos = n.length===2 ? [r1,r1] : (n[2]==="s" ? [r1,r2] : [r2,r1]);
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc])=>{
        const rr=pos[0]+dr, cc=pos[1]+dc; if(rr<0||rr>12||cc<0||cc>12) return;
        if(rs[k][IDX[handAt(rr,cc)]]!==rs[k][h]) border=true;
      });
    }
    if(border || Math.random()<0.25 || t>50) return {h,s};
  }
  return {h:rand(169), s:g[rand(g.length)]};
}

function trendSVG(points){
  const W=640,H=230,L=34,Rr=12,T=14,B=30;
  const n=points.length, x=i=> n<=1 ? (L+(W-L-Rr)/2) : L+(W-L-Rr)*i/(n-1), y=v=>T+(H-T-B)*(1-v/100);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Drill accuracy by session">';
  [0,25,50,75,100].forEach(v=>{ s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+v+'%</text>'; });
  s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(90)+'" y2="'+y(90)+'" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<text x="'+(W-Rr)+'" y="'+(y(90)-5)+'" font-size="11" text-anchor="end" fill="var(--good)" font-weight="700">Mastery 90%</text>';
  if(n){
    // rolling average of last 5
    const ra=points.map((p,i)=>{ const sl=points.slice(Math.max(0,i-4),i+1); return sl.reduce((a,b)=>a+b.p,0)/sl.length; });
    if(n>1){
      s+='<path d="M'+points.map((p,i)=>x(i)+","+y(p.p)).join(" L")+'" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity=".5"/>';
      s+='<path d="M'+ra.map((v,i)=>x(i)+","+y(v)).join(" L")+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    points.forEach((p,i)=>{ s+='<circle cx="'+x(i)+'" cy="'+y(p.p)+'" r="'+(i===n-1?5:3.5)+'" fill="'+(i===n-1?"var(--accent)":"var(--panel)")+'" stroke="var(--accent)" stroke-width="2"><title>'+esc(p.label)+": "+p.p+'%</title></circle>'; });
    const step=Math.max(1,Math.ceil(n/8));
    points.forEach((p,i)=>{ if(i%step===0||i===n-1) s+='<text x="'+x(i)+'" y="'+(H-10)+'" font-size="11" text-anchor="middle" fill="var(--muted)">'+(i+1)+'</text>'; });
  }
  return s+'</svg>';
}

function sessName(s){

/* ---------- DRILL ---------- */
let SES=null, drillSetupTab="mixed", setupChart=CH[0].id, setupLen={mixed:36, focus:20};
function startSession(cfg){
  const queue=[];
  if(cfg.type==="retry"){
    missPool().slice(0,cfg.n).forEach(m=>queue.push({c:m.c, h:m.h, s:m.s}));
    for(let i=queue.length-1;i>0;i--){ const j=rand(i+1); [queue[i],queue[j]]=[queue[j],queue[i]]; }
    cfg.n=queue.length;
    if(!cfg.n) return;
  }
  SES={type:cfg.type, chart:cfg.chart||null, n:cfg.n, items:[], queue, used:{}, order:[], q:null, answered:false};
  if(cfg.type==="mixed"){ let ids=[]; while(ids.length<cfg.n){ const sh=CH.map(c=>c.id); for(let i=sh.length-1;i>0;i--){ const j=rand(i+1); [sh[i],sh[j]]=[sh[j],sh[i]]; } ids=ids.concat(sh); } SES.order=ids.slice(0,cfg.n); }
  nextQ();
  setView("drill");
}
function nextQ(){
  const i=SES.items.length;
  let q;
  if(SES.type==="retry") q=Object.assign({}, SES.queue[i]);
  else {
    const id = SES.type==="mixed" ? SES.order[i] : SES.chart;
    const ch=CHMAP[id]; SES.used[id]=SES.used[id]||new Set();
    const p=pick(ch, SES.used[id]); SES.used[id].add(p.h+"|"+p.s);
    q={c:id, h:p.h, s:p.s};
  }
  const suits=["s","h","d","c"], n=D.names[q.h], s1=suits[rand(4)];
  const others=suits.filter(x=>x!==s1);
  q.s1=s1; q.s2 = n.length===3 && n[2]==="s" ? s1 : others[rand(3)];
  q.t0=performance.now();
  SES.q=q; SES.answered=false;
}
function cardHTML(r,su){ const sym={s:"♠",h:"♥",d:"♦",c:"♣"}[su]; return '<div class="card'+(su==="h"||su==="d"?" red":"")+'">'+(r==="T"?"10":r)+'<small>'+sym+'</small></div>'; }
function renderDrill(){
  const el=$("v-drill");

  h+='<div class="progress"><i style="width:'+(i/SES.n*100)+'%"></i></div>';

  h+='<div class="cards">'+cardHTML(n[0],q.s1)+cardHTML(n[1],q.s2)+'</div>';

    h+='<div class="fb '+(it.ok?"ok":"no")+'"><b>'+(it.ok?"Correct":"Wrong")+' — '+(ans?verbOf(ch).toLowerCase():"fold")+'</b><span>'+n+' at '+q.s+' BB: '+lim+'</span></div>';
    h+='<div class="answer"><button class="btn primary" id="aNext">'+(SES.items.length>=SES.n?"See results":"Next hand")+'</button><button class="btn" id="aChart">'+(SES.showChart?"Hide chart":"Show chart")+'</button></div>';
    if(SES.showChart) h+='<div class="grid" id="mini"></div><div class="legend">'+legendHTML(ch)+'</div>';
  }
  h+='<button class="btn small" id="aQuit" style="justify-self:start">End session</button></section>';
  el.innerHTML=h;
  if(!SES.answered){ $("aYes").onclick=()=>answer(true); $("aNo").onclick=()=>answer(false); }
  else {
    $("aNext").onclick=()=>{ SES.showChart=false; if(SES.items.length>=SES.n) finish(); else { nextQ(); renderDrill(); } };
    $("aChart").onclick=()=>{ SES.showChart=!SES.showChart; renderDrill(); };
    if(SES.showChart) renderGrid($("mini"), ch, q.s, {pick:n});
  }
  $("aQuit").onclick=()=>{ if(SES.items.length>=5) finish(); else { SES=null; renderDrill(); } };
}
function answer(yes){
  if(!SES || SES.answered) return;

function renderSetup(el){

  if(drillSetupTab==="mixed"){
    h+='<p class="muted">Every chart in turn — bubble, no-bubble and heads-up — at random stack sizes. Best for checking how well you know everything.</p>';
  } else {
    h+='<p class="muted">One situation at many different stack sizes. Use it to learn a chart, then check it with a mixed drill.</p>';
    ["icm","chip","hu"].forEach(m=>{
      h+='<div class="label">'+MODE_LONG[m]+'</div><div class="chips">';
      CH.filter(c=>c.mode===m).forEach(c=>{ const a=chartAcc(c.id,undefined,40), g=grade(a.n>=5?a.p:null);
        h+='<button type="button" data-c="'+c.id+'" aria-pressed="'+(setupChart===c.id)+'"><b>'+c.short+'</b><span class="pill '+g.c+'" style="margin-top:4px">'+(a.n>=5?a.p+"%":"New")+'</span></button>'; });
      h+='</div>';
    });
  }
  const lens = drillSetupTab==="mixed" ? [24,36,60] : [20,30,50];
  h+='<div class="label">Hands</div><div class="seg" id="lenSeg">'+lens.map(n=>'<button type="button" data-n="'+n+'" aria-pressed="'+(setupLen[drillSetupTab]===n)+'">'+n+'</button>').join("")+'</div>';
  h+='<button class="btn primary block" id="goBtn">Start</button>';
  const mp=missPool(); if(mp.length) h+='<button class="btn block" id="retryBtn">Drill my weak spots ('+Math.min(mp.length,20)+')</button>';
  h+='</section>';
  el.innerHTML=h;
  el.querySelectorAll("#setupSeg button").forEach(b=>b.onclick=()=>{ drillSetupTab=b.dataset.t; renderSetup(el); });
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ setupChart=b.dataset.c; renderSetup(el); });
  el.querySelectorAll("#lenSeg button").forEach(b=>b.onclick=()=>{ setupLen[drillSetupTab]=+b.dataset.n; renderSetup(el); });
  $("goBtn").onclick=()=>startSession(drillSetupTab==="mixed" ? {type:"mixed", n:setupLen.mixed} : {type:"focus", chart:setupChart, n:setupLen.focus});
  if($("retryBtn")) $("retryBtn").onclick=()=>startSession({type:"retry", n:Math.min(mp.length,20)});
}

/* ---------- CHARTS ---------- */
const CS={mode:"icm", key:0, stack:10, nums:false};
function renderCharts(){
  const list=CH.filter(c=>c.mode===CS.mode), ch=list[CS.key]||list[0], g=gridOf(ch);
  CS.stack=Math.min(Math.max(CS.stack,g[0]),g[g.length-1]);
  let h='<section class="panel"><div class="seg" id="cMode">'+["icm","chip","hu"].map(m=>'<button type="button" data-m="'+m+'" aria-pressed="'+(CS.mode===m)+'">'+MODE_LONG[m]+'</button>').join("")+'</div>';
  h+='<div class="chips" id="cKey">'+list.map((c,i)=>'<button type="button" data-i="'+i+'" aria-pressed="'+(c===ch)+'"><b>'+c.short+'</b>'+(c.act==="shove"?"Shove first in":"Call a shove")+'</button>').join("")+'</div>';
  h+='<div class="slider"><b>'+CS.stack+'<span class="muted" style="font-size:13px"> BB</span></b><input type="range" id="cStack" min="'+g[0]+'" max="'+g[g.length-1]+'" value="'+CS.stack+'" aria-label="Effective stack in big blinds"></div></section>';
  h+='<section class="panel"><div class="between"><div><h3>'+esc(ch.title)+'</h3><span class="muted mono" id="cPct" style="font-size:13px"></span></div><label class="row muted" style="font-size:13px"><input type="checkbox" id="cNums"'+(CS.nums?" checked":"")+'> Max stack</label></div>';
  h+='<div class="grid" id="cGrid"></div><div class="legend">'+legendHTML(ch)+'</div><p class="muted" style="font-size:12px">Suited top-right, offsuit bottom-left, pairs on the diagonal. 3-handed charts assume similar stacks; bubble charts assume opponents also play the bubble correctly.</p></section>';
  $("v-charts").innerHTML=h;
  const p=renderGrid($("cGrid"), ch, CS.stack, {nums:CS.nums});
  $("cPct").textContent=verbOf(ch)+" "+p+"% of hands at "+CS.stack+" BB";
  $("v-charts").querySelectorAll("#cMode button").forEach(b=>b.onclick=()=>{ CS.mode=b.dataset.m; CS.key=0; renderCharts(); });
  $("v-charts").querySelectorAll("#cKey button").forEach(b=>b.onclick=()=>{ CS.key=+b.dataset.i; renderCharts(); });
  $("cStack").oninput=e=>{ CS.stack=+e.target.value; const pp=renderGrid($("cGrid"), ch, CS.stack, {nums:CS.nums}); $("cPct").textContent=verbOf(ch)+" "+pp+"% of hands at "+CS.stack+" BB"; e.target.previousElementSibling.firstChild.nodeValue=CS.stack; };
  $("cNums").onchange=e=>{ CS.nums=e.target.checked; renderCharts(); };
}

/* ---------- boot ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="drill" && SES && SES.done) SES=null; setView(b.dataset.v); });
setView("home");
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
